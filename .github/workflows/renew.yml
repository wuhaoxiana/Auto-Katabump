name: Katabump Auto Renew

on:
  schedule:
  - cron: '50 0 * * *'  # 每天 UTC 1点 (北京时间 9点) 运行,根据服务到期时间自行修改
  workflow_dispatch: # 允许手动触发

jobs:
  Renew-Katabump:
    runs-on: ubuntu-latest
    permissions:
      actions: write  
      contents: read

    steps:
    - name: 📅 日期检查
      id: check
      run: |
        START="2026-07-27"
        TODAY=$(date -u +%F)
        start_sec=$(date -d "$START" +%s)
        today_sec=$(date -d "$TODAY" +%s)
        days=$(( (today_sec - start_sec) / 86400 ))
        echo "Days since $START: $days"
        if (( days % 4 == 0 )); then
          echo "should_run=true" >> "$GITHUB_OUTPUT"
        else
          echo "should_run=false" >> "$GITHUB_OUTPUT"
        fi
    
    - name: 📥 下载代码
      if: steps.check.outputs.should_run == 'true'
      uses: actions/checkout@v6
    - name: ⚙ 设置 Python
      if: steps.check.outputs.should_run == 'true'
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: 🛠️ 安装系统依赖和python依赖
      if: steps.check.outputs.should_run == 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
        pip install seleniumbase requests
        seleniumbase install chromedriver

    - name: ⚙ 设置代理 (sing-box)
      if: steps.check.outputs.should_run == 'true'
      continue-on-error: true
      env:
        NODE_LINK: ${{ vars.NODE_LINK }}
      run: |
        bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

    - name: 🚀 运行多账号续期脚本
      if: steps.check.outputs.should_run == 'true'
      env:
        KATABUMP_EMAIL: ${{ vars.KATABUMP_EMAIL }}
        KATABUMP_PASSWORD: ${{ vars.KATABUMP_PASSWORD }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          python3 app.py

    - name: 🧹 清理旧的工作流运行记录
      if: steps.check.outputs.should_run == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
        count=0
        for run_id in $runs; do
          count=$((count + 1))
          if [ $count -gt 1 ]; then
            echo "删除运行记录: $run_id"
            gh run delete $run_id || true
          fi
        done
